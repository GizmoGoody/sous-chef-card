# Publishes a release for every version tag (v0.2.0, v0.2.0-alpha.1), once
# the CI checks pass. The Marketplace reads the card from the release's
# asset. A tag with a hyphen (alpha, beta) becomes a pre-release, which the
# Marketplace offers only with the repository's Pre-release switch on.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build
        run: |
          npm install --no-audit --no-fund
          VERSION="${GITHUB_REF_NAME#v}" npm run build
          grep -q "${GITHUB_REF_NAME#v}" dist/sous-chef-card.js

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/sous-chef-card.js \
            --verify-tag ${prerelease} --title "${GITHUB_REF_NAME}" --generate-notes
