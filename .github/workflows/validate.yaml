# The Marketplace's own checks of the repository (hacs/action). They read
# the card from the latest stable release (pre-releases do not count) or
# else from the branch, which has no built card, so they run when a stable
# release is published, or by hand.
name: Marketplace validation

on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
